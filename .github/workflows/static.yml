name: Publicar demonstração

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extrair o site
        run: |
          unzip -q andre-marmoraria.zip -d site
          unzip -oq andre-marmoraria-fotos.zip -d site
          unzip -oq andre-marmoraria-estilos.zip -d site
          find site/andre-marmoraria -name "*.html" -exec sed -i "s|assets/style.css|assets/style.css?v=$GITHUB_SHA|g" {} +
          test -f site/andre-marmoraria/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/andre-marmoraria
      - id: deployment
        uses: actions/deploy-pages@v4
